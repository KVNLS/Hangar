[package]
name = "hangar-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "Hangar"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Syntax highlighting: only the grammars Hangar's target stacks need (JSON comes with `tree-sitter`).
gpui-kit = { workspace = true, features = [
    "tree-sitter",
    "tree-sitter-swift",
    "tree-sitter-kotlin",
    "tree-sitter-java",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-rust",
    "tree-sitter-bash",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-css",
    "tree-sitter-html",
] }
hangar-core.workspace = true
hangar-store-sqlite.workspace = true
hangar-usecases.workspace = true
hangar-worktree.workspace = true
hangar-agents.workspace = true
hangar-terminal.workspace = true
hangar-files.workspace = true
hangar-devices.workspace = true
hangar-runner.workspace = true
hangar-mcp.workspace = true
image.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
notify-rust.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
core-video.workspace = true
core-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-io-surface.workspace = true
objc2-core-foundation.workspace = true

[lints]
workspace = true
