[workspace]
resolver = "3"
members = ["crates/*", "examples"]
exclude = ["third_party/gpui-pre-apple"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KVNLS/Hangar"
publish = false

[workspace.dependencies]
hangar-core = { path = "crates/core" }
hangar-store-sqlite = { path = "crates/store-sqlite" }
hangar-usecases = { path = "crates/usecases" }
hangar-worktree = { path = "crates/worktree" }
hangar-agents = { path = "crates/agents" }
hangar-terminal = { path = "crates/terminal" }
hangar-files = { path = "crates/files" }
hangar-devices = { path = "crates/devices" }
hangar-runner = { path = "crates/runner" }
hangar-mcp = { path = "crates/mcp" }
hangar-app = { path = "crates/app" }

# gpui-kit is gpui-component's umbrella crate (re-exports gpui-pre 0.3.7, gpui-component, platform).
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }

anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
notify = "8.2.0"
tree-sitter = "0.27.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
    "NSImage",
    "NSResponder",
] }
objc2-io-surface = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
# The CoreVideo types GPUI's `paint_surface` takes (hangar-app only; already built by gpui-pre).
core-video = "0.5.2"
core-foundation = "0.10.1"
block2 = "0.6.2"
libc = "0.2.190"
# System notifications on macOS, Windows and Linux (hangar-app only).
notify-rust = "4.18.1"
tempfile = "3.27.0"
# Android emulator gRPC (hangar-devices only).
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
prost = "0.14.4"
tonic-prost-build = { version = "0.14.6", default-features = false }
protox = "0.9.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 2

# BGRA CoreVideo surfaces for zero-copy device frames (zed PR #61291); see
# third_party/gpui-pre-apple/HANGAR_PATCH.md. Drop once the gpui-component pin ships them.
[patch.crates-io]
gpui-pre-apple = { path = "third_party/gpui-pre-apple" }
